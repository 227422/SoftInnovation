[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-notice-classifier"
version = "1.0.0"
description = "Independent rule-based campus notice classification"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["campus_notice*"]

[tool.setuptools.package-data]
campus_notice = ["rules.json"]
