[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-backend"
version = "0.1.0"
description = "Modular campus account API and audited public notice collector"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "starlette==0.52.1", "uvicorn==0.54.0", "SQLAlchemy==2.1.6", "alembic==1.20.1", "pwdlib[argon2]==0.3.1", "email-validator==2.3.0", "httpx==0.28.1", "beautifulsoup4==4.15.0", "pypdf==6.21.4", "python-docx==1.2.0", "openpyxl==3.1.5", "xlrd==2.0.2", "Pillow==13.0.0", "campus-notice-classifier==1.0.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "jsonschema==4.26.0", "xlwt==1.3.0"]

[project.scripts]
campus-backend = "campus_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"campus_backend.catalog" = ["data/*.json"]
"campus_backend.sources" = ["data/runtime_registry.json"]
"campus_backend.documents" = ["vision.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
